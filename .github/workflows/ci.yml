name: CI
'on':
  push:
    branches:
      - master
      - develop
      - v5
      - v6
  workflow_dispatch:

jobs:
  build-dita:
    name: Build DITA
    runs-on: ubuntu-latest
    steps:
      - name: Git checkout
        uses: actions/checkout@v7

      - name: Calculate short SHA
        uses: benjlevesque/short-sha@v4.0
        id: short-sha
        with:
          length: 7
      - run: echo $SHA
        env:
          SHA: ${{ steps.short-sha.outputs.sha }}
      - run: echo $SHA
        env:
          SHA: ${{ env.SHA }}

      # 1. Resolve external plugin URLs with branch matching/fallback and zip local specialization plugin
      - name: Resolve Plugin URLs 🔗
        id: plugins
        run: |
          owner="${{ github.repository_owner }}"
          ref="${{ github.ref_name }}"

          # Zip the current repository files (excluding node_modules, .git, .github) to avoid expansion issues in Docker
          zip -r specialization.zip . -x "node_modules/*" ".git/*" ".github/*" ".DS_Store" "specialization.zip"

          # Function to check URL existence and return fallback on failure
          get_plugin_url() {
            local repo=$1
            local fork_url="https://github.com/${owner}/${repo}/archive/${ref}.zip"
            # TODO: Remove dev_url check once v6 branch is merged upstream
            local dev_url="https://github.com/jason-fox/${repo}/archive/${ref}.zip"
            local upstream_url="https://github.com/dita-bootstrap/${repo}/archive/${ref}.zip"
            
            if curl -sfIL "$fork_url" >/dev/null; then
              echo "$fork_url"
            elif [ "${owner}" != "jason-fox" ] && curl -sfIL "$dev_url" >/dev/null; then
              echo "$dev_url"
            elif curl -sfIL "$upstream_url" >/dev/null; then
              echo "$upstream_url"
            else
              echo "https://github.com/dita-bootstrap/${repo}/archive/develop.zip"
            fi
          }

          HTML_URL=$(get_plugin_url "dita-bootstrap.html")
          LUNR_URL=$(get_plugin_url "dita-bootstrap.lunr")
          THEME_URL=$(get_plugin_url "dita-bootstrap.theme-switcher")

          # Generate multiline output list for the plugins
          EOF=$(dd if=/dev/urandom bs=15 count=1 2>/dev/null | base64 | tr -dc 'a-zA-Z0-9')
          echo "list<<$EOF" >> $GITHUB_OUTPUT
          echo "fox.jason.extend.css" >> $GITHUB_OUTPUT
          echo "./specialization.zip" >> $GITHUB_OUTPUT # Install the zipped local plugin
          echo "$HTML_URL" >> $GITHUB_OUTPUT
          echo "$LUNR_URL" >> $GITHUB_OUTPUT
          echo "https://github.com/jason-fox/fox.jason.prismjs/archive/master.zip" >> $GITHUB_OUTPUT
          echo "fox.jason.favicon" >> $GITHUB_OUTPUT
          echo "fox.jason.open-graph" >> $GITHUB_OUTPUT
          echo "$THEME_URL" >> $GITHUB_OUTPUT
          echo "$EOF" >> $GITHUB_OUTPUT

      # 2. Build Bootstrap using the resolved plugins list
      - name: Build Bootstrap
        uses: dita-ot/dita-ot-action@4.4
        with:
          install: |
            apt-get update -q
            export DEBIAN_FRONTEND=noninteractive
            apt-get install -qy --no-install-recommends nodejs
            nodejs -v
          plugins: ${{ steps.plugins.outputs.list }}
          project: .github/dita-ot/html.xml

      # 3. Determine target folder dynamically based on current branch
      - name: Determine target folder 📁
        id: set-target
        run: |
          if [ "${{ github.ref_name }}" = "master" ] || [ "${{ github.ref_name }}" = "develop" ]; then
            echo "target_dir=" >> $GITHUB_OUTPUT
          else
            echo "target_dir=${{ github.ref_name }}" >> $GITHUB_OUTPUT
          fi

      # 4. Deploy to the dynamically resolved folder on gh-pages
      - name: Deploy HTML 🚀
        uses: JamesIves/github-pages-deploy-action@v4.8.0
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          branch: gh-pages # The branch the action should deploy to.
          folder: out/html # The folder the action should deploy.
          target-folder: ${{ steps.set-target.outputs.target_dir }}
          commit-message: '🚀 Deploy ${{ env.SHA }} to GitHub Pages (${{ github.ref_name }})'
          git-config-name: 'GitHub Action'
          git-config-email: 'action@github.com'
          clean-exclude: |
            v5
            v6
